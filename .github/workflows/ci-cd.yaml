name: CI/CD

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'api_v1/**'
      - 'backend_project/**'
      - 'frontend/**'
      - 'ai_grader/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'Dockerfile.celery'
      - 'entrypoint.sh'
      - 'docker-compose.yml'
      - 'nginx/**'
      - '.github/workflows/ci-cd.yaml'
  pull_request:
    paths:
      - 'api_v1/**'
      - 'backend_project/**'
      - 'frontend/**'
      - 'ai_grader/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'Dockerfile.celery'
      - 'entrypoint.sh'
      - 'docker-compose.yml'
      - 'nginx/**'
      - '.github/workflows/ci-cd.yaml'
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: quiz_test
          POSTGRES_USER: quiz_user
          POSTGRES_PASSWORD: quiz_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-not-a-real-secret
      DEBUG: "True"
      DATABASE_URL: postgresql://quiz_user:quiz_pass@localhost:5432/quiz_test
      DB_SSL_REQUIRE: "False"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test api_v1 --verbosity=2

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Test
        run: npm test -- --run
        working-directory: frontend

  build-and-publish:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            file: Dockerfile
            suffix: ""
            scan: true
          - name: celery
            context: .
            file: Dockerfile.celery
            suffix: "-celery"
            scan: false
          - name: grader
            context: ./ai_grader
            file: ai_grader/Dockerfile
            suffix: "-grader"
            scan: false

    steps:
      - uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/r-scibor/quiz-app${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: quiz-app-${{ matrix.name }}:local-scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Scan web image
        if: matrix.scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: quiz-app-${{ matrix.name }}:local-scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    name: Deploy to Homelab
    needs: build-and-publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted

    steps:
      - name: Update checkout, pull images, and restart
        run: |
          cd /home/endmin/homelab/Quiz-App
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
          docker compose pull
          docker compose up -d --remove-orphans

      - name: Notify failure
        if: failure()
        run: |
          if [ -x /home/endmin/homelab/ntfy/notify.sh ]; then
            /home/endmin/homelab/ntfy/notify.sh --fail --title "CI fail Quiz-App" "Job 'deploy' failed on ${{ github.ref_name }}" --click "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
            python3 /home/endmin/homelab/ntfy/hooks/watch.py --mark-seen R-Scibor/Quiz-App "${{ github.run_id }}" || true
          fi
